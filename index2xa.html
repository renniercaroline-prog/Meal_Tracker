<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F4F6F2">
<title>Plate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{
  --bg:#F4F6F2; --card:#FFFFFF; --ink:#182320; --muted:#5F6B66; --line:#DCE2DC;
  --kcal:#1F6B4E; --kcal-soft:#DCEBE3; --pro:#2B5FAE; --pro-soft:#DCE6F5;
  --danger:#A83A2E; --radius:14px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Instrument Sans",-apple-system,"Helvetica Neue",Arial,sans-serif;font-size:16px;-webkit-text-size-adjust:100%}
body{padding-top:var(--sat);padding-bottom:calc(var(--sab) + 64px)}
button,input,textarea,select{font:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card);outline:none}
input:focus,textarea:focus{border-color:var(--kcal);box-shadow:0 0 0 3px var(--kcal-soft)}
input[type=number]{-moz-appearance:textfield}
h1,h2,h3{margin:0;font-weight:600}
h1{font-size:22px}
h2{font-size:17px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
main{max-width:560px;margin:0 auto;padding:12px 16px 24px}
.view{display:none}.view.active{display:block}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;padding:8px 0 14px}
.daynav{display:flex;align-items:center;gap:6px}
.daynav button{width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:18px;line-height:1}
.daynav .date{font-weight:600;min-width:120px;text-align:center}

/* hero bars */
.hero{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 16px 16px}
.stat{margin-bottom:16px}
.stat:last-child{margin-bottom:0}
.stat .row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.stat .num{font-size:34px;font-weight:700;letter-spacing:-0.5px;line-height:1}
.stat .num span{font-size:15px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:4px}
.bar{height:14px;border-radius:7px;background:var(--bg);overflow:hidden}
.bar i{display:block;height:100%;border-radius:7px;width:0;transition:width .35s ease}
.kcal .bar i{background:var(--kcal)}.pro .bar i{background:var(--pro)}
.bar i.over{background:var(--danger)}
.ratio{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);margin-top:16px;padding-top:12px}
.ratio b{font-size:20px;font-weight:700}
.macros{display:flex;gap:14px;margin-top:6px}

/* lists */
.list{margin-top:18px}
.list h2{margin-bottom:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.item .body{flex:1;min-width:0}
.item .name{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .meta{font-size:13px;color:var(--muted);margin-top:2px}
.item .nums{text-align:right;font-size:13px;white-space:nowrap}
.item .nums b{display:block;font-size:15px}
.item.tap{cursor:pointer}
.item .x{color:var(--muted);font-size:20px;padding:4px 0 4px 8px}
.empty{background:transparent;border:1px dashed var(--line);border-radius:12px;padding:20px;text-align:center;color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:12px 16px;font-weight:600;background:var(--ink);color:#fff;width:100%}
.btn.secondary{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.green{background:var(--kcal)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.btn.sm{width:auto;padding:8px 12px;font-size:14px;border-radius:10px}
.btnrow{display:flex;gap:8px;margin-top:12px}
.btnrow .btn{flex:1}

/* tabs */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 0 calc(var(--sab) + 6px);z-index:20}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);padding:6px 0}
nav button.active{color:var(--ink);font-weight:600}
nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(24,35,32,.35);z-index:30;display:none}
.sheet-bg.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92%;background:var(--bg);border-radius:18px 18px 0 0;z-index:31;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s ease}
.sheet.open{transform:none}
.sheet .head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
.sheet .head button{font-weight:600;color:var(--kcal)}
.sheet .content{overflow:auto;padding:0 16px calc(var(--sab) + 20px);-webkit-overflow-scrolling:touch}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.result{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.result .body{flex:1;min-width:0}
.result .name{font-weight:500}
.result .meta{font-size:13px;color:var(--muted)}
.result .src{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 6px;white-space:nowrap}
#reader{border-radius:12px;overflow:hidden;background:#000;margin:8px 0}
#reader video{width:100%!important}
.note{background:var(--kcal-soft);color:var(--kcal);border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0}
.err{background:#F6E3E0;color:var(--danger);border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0}
.pill{display:inline-block;background:var(--pro-soft);color:var(--pro);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600}
.ing{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.ing .body{flex:1;min-width:0}
.ing input.g{width:74px;text-align:right;padding:7px 8px}
.ing .unmatched{color:var(--danger)}
.favs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;margin:14px 0 0;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.favs::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-weight:500;font-size:14px;white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis}
.chip small{color:var(--muted);font-weight:400;margin-left:4px}
.chip.recipe{border-color:var(--kcal);color:var(--kcal)}
.toast{position:fixed;left:50%;bottom:calc(var(--sab) + 84px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<main>
  <!-- TODAY -->
  <section id="view-today" class="view active">
    <div class="top">
      <h1>Today</h1>
      <div class="daynav">
        <button id="dayPrev" aria-label="Previous day">&#8249;</button>
        <div class="date" id="dayLabel"></div>
        <button id="dayNext" aria-label="Next day">&#8250;</button>
      </div>
    </div>

    <div class="hero">
      <div class="stat kcal">
        <div class="row"><div class="num" id="kcalNum">0<span>kcal</span></div><div class="muted small" id="kcalTarget"></div></div>
        <div class="bar"><i id="kcalBar"></i></div>
      </div>
      <div class="stat pro">
        <div class="row"><div class="num" id="proNum">0<span>g protein</span></div><div class="muted small" id="proTarget"></div></div>
        <div class="bar"><i id="proBar"></i></div>
      </div>
      <div class="ratio">
        <div><div class="small muted">Protein per 100 kcal</div><div class="macros small muted" id="macroLine"></div></div>
        <b id="ratioNum">0.0 g</b>
      </div>
    </div>

    <div id="favRow"></div>
    <div class="btnrow">
      <button class="btn green" id="addFood">Add food</button>
      <button class="btn secondary" id="addRecipeShortcut">Add recipe</button>
    </div>

    <div class="list">
      <h2>Logged</h2>
      <div id="logList"></div>
    </div>
  </section>

  <!-- RECIPES -->
  <section id="view-recipes" class="view">
    <div class="top"><h1>Recipes</h1><button class="btn sm" id="newRecipe">New recipe</button></div>
    <div id="draftBanner"></div>
    <div id="recipeList"></div>
  </section>

  <!-- SETTINGS -->
  <section id="view-settings" class="view">
    <div class="top"><h1>Settings</h1></div>
    <h2>Daily targets</h2>
    <div class="grid2" style="margin:10px 0 20px">
      <div class="field"><label>Calories (kcal)</label><input type="number" inputmode="numeric" id="tKcal"></div>
      <div class="field"><label>Protein (g)</label><input type="number" inputmode="numeric" id="tPro"></div>
    </div>
    <h2>My foods</h2>
    <p class="small muted" style="margin:4px 0 10px">Foods you entered from a label. Values are per 100 g.</p>
    <div id="foodList"></div>
    <button class="btn secondary" id="newFood" style="margin-top:8px">Add a food from a label</button>
    <h2 style="margin-top:28px">Your data</h2>
    <p class="small muted" style="margin:4px 0 10px">Everything is stored in this browser on this phone. Export now and then so you have a copy.</p>
    <div class="btnrow" style="margin-top:0">
      <button class="btn secondary" id="exportBtn">Export</button>
      <label class="btn secondary" style="cursor:pointer">Import<input type="file" id="importFile" accept="application/json" style="display:none"></label>
    </div>
    <button class="btn danger" id="wipeBtn" style="margin-top:24px">Delete everything</button>
  </section>
</main>

<nav>
  <button data-tab="today" class="active"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Today</button>
  <button data-tab="recipes"><svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8 10h8M8 14h8M8 18h5"/></svg>Recipes</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>Settings</button>
</nav>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet">
  <div class="head"><h2 id="sheetTitle"></h2><button id="sheetClose">Done</button></div>
  <div class="content" id="sheetBody"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ---------- generic foods (per 100 g, raw unless stated; typical UK/USDA values, check labels for packaged versions) ---------- */
const GENERIC = [
["Chicken breast (raw)",120,22.5,0,2.6],["Chicken thigh, skinless (raw)",121,19.7,0,4.7],["Turkey breast (raw)",114,24,0,1.5],["Turkey mince 7% (raw)",148,19,0,7],
["Beef mince 5% (raw)",137,21,0,5],["Beef mince 20% (raw)",254,17,0,20],["Beef steak, sirloin (raw)",150,21,0,7],["Pork loin (raw)",143,21,0,6],["Bacon, back (raw)",214,16,0,17],
["Salmon fillet (raw)",208,20,0,13],["Cod fillet (raw)",82,18,0,0.7],["Tuna, canned in water (drained)",116,26,0,1],["Prawns (raw)",85,20,0,0.5],["Smoked salmon",117,18,0,4.5],
["Egg, whole (raw)",143,12.6,0.7,9.5],["Egg white",52,11,0.7,0.2],["Greek yogurt 0% fat",57,10,4,0.2],["Greek yogurt, full fat",97,9,4,5],["Skyr",63,11,4,0.2],["Cottage cheese",98,11,3.4,4.3],
["Milk, semi-skimmed",47,3.6,4.8,1.7],["Milk, whole",64,3.4,4.7,3.6],["Milk, skimmed",35,3.5,5,0.1],["Oat milk",45,1,6.6,1.5],["Whey protein powder",380,75,8,6],
["Cheddar",416,25,0.1,35],["Feta",264,14,4,21],["Mozzarella",280,22,2,20],["Parmesan",392,32,0,29],["Halloumi",321,22,2,26],["Cream cheese",342,6,4,34],["Butter",717,0.9,0.1,81],
["Oats, rolled",379,13,68,7],["Rice, white (raw)",365,7,80,0.7],["Rice, white (cooked)",130,2.7,28,0.3],["Rice, brown (raw)",362,7.5,76,2.7],["Pasta, dry",371,13,75,1.5],["Pasta (cooked)",158,5.8,31,0.9],
["Quinoa (raw)",368,14,64,6],["Couscous (raw)",376,13,77,0.6],["Bread, white (slice)",265,9,49,3.2],["Bread, wholemeal",247,13,41,3.4],["Sourdough",260,9,51,1.5],["Tortilla wrap",310,8,50,8],["Pitta bread",275,9,55,1.2],
["Potato (raw)",77,2,17,0.1],["Sweet potato (raw)",86,1.6,20,0.1],["Lentils, dry",352,25,60,1],["Lentils, cooked",116,9,20,0.4],["Chickpeas, canned (drained)",139,7,22,2.6],["Black beans, canned (drained)",91,6,16,0.5],
["Kidney beans, canned (drained)",127,8.7,22,0.5],["Baked beans",81,5,13,0.4],["Tofu, firm",144,17,3,9],["Edamame (shelled)",121,12,9,5],["Hummus",237,7,15,17],
["Avocado",160,2,8.5,15],["Banana",89,1.1,23,0.3],["Apple",52,0.3,14,0.2],["Blueberries",57,0.7,14,0.3],["Strawberries",32,0.7,7.7,0.3],["Raspberries",52,1.2,12,0.7],["Orange",47,0.9,12,0.1],
["Grapes",69,0.7,18,0.2],["Mango",60,0.8,15,0.4],["Pineapple",50,0.5,13,0.1],["Kiwi",61,1.1,15,0.5],["Lemon juice",22,0.4,7,0.2],["Dates",277,1.8,75,0.2],
["Broccoli",34,2.8,7,0.4],["Spinach",23,2.9,3.6,0.4],["Kale",49,4.3,9,0.9],["Carrot",41,0.9,10,0.2],["Tomato",18,0.9,3.9,0.2],["Cherry tomatoes",18,0.9,3.9,0.2],["Cucumber",15,0.7,3.6,0.1],
["Bell pepper",26,1,6,0.3],["Onion",40,1.1,9,0.1],["Garlic",149,6.4,33,0.5],["Mushrooms",22,3.1,3.3,0.3],["Courgette",17,1.2,3.1,0.3],["Aubergine",25,1,6,0.2],["Peas, frozen",81,5.4,14,0.4],
["Sweetcorn",86,3.3,19,1.2],["Green beans",31,1.8,7,0.1],["Asparagus",20,2.2,3.9,0.1],["Lettuce",15,1.4,2.9,0.2],["Rocket",25,2.6,3.7,0.7],["Cauliflower",25,1.9,5,0.3],["Beetroot",43,1.6,10,0.2],
["Olive oil",884,0,0,100],["Coconut oil",862,0,0,100],["Peanut butter",588,25,20,50],["Almond butter",614,21,19,56],["Almonds",579,21,22,50],["Walnuts",654,15,14,65],["Cashews",553,18,30,44],
["Chia seeds",486,17,42,31],["Flaxseed",534,18,29,42],["Pumpkin seeds",559,30,11,49],["Honey",304,0.3,82,0],["Maple syrup",260,0,67,0],["Sugar",387,0,100,0],["Jam",250,0.4,60,0.1],
["Dark chocolate 70%",598,8,46,43],["Soy sauce",53,8,5,0.6],["Mayonnaise",680,1,1,75],["Ketchup",101,1,25,0.2],["Pesto",450,5,6,45],["Tomato passata",30,1.3,5,0.2],["Coconut milk, canned",197,2,3,21],["Stock (made up)",5,0.4,0.5,0.2]
].map(([n,k,p,c,f])=>({name:n,per100:{k,p,c,f},src:"generic"}));

/* ---------- state ---------- */
const KEY="plate_v1";
const DEFAULT={targets:{kcal:2000,protein:130},foods:[],recipes:[],log:{},draft:null,favs:[]};
let S=load();
function load(){try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&j.targets)return Object.assign({},DEFAULT,j);}catch(e){}return JSON.parse(JSON.stringify(DEFAULT));}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast("Could not save: storage full or blocked");}}
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r1=n=>Math.round(n*10)/10, r0=n=>Math.round(n);
function dkey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
let viewDate=new Date();
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2200);}

/* ---------- tabs ---------- */
document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>showTab(b.dataset.tab)));
function showTab(t){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===t));
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("active",v.id==="view-"+t));
  if(t==="today")renderToday();if(t==="recipes")renderRecipes();if(t==="settings")renderSettings();
  window.scrollTo(0,0);
}

/* ---------- sheet ---------- */
const sheet=document.getElementById("sheet"),sheetBg=document.getElementById("sheetBg"),sheetBody=document.getElementById("sheetBody");
let onSheetClose=null;
function openSheet(title,html,closeCb){document.getElementById("sheetTitle").textContent=title;sheetBody.innerHTML=html;onSheetClose=closeCb||null;sheetBg.classList.add("open");sheet.classList.add("open");sheetBody.scrollTop=0;}
function closeSheet(){sheet.classList.remove("open");sheetBg.classList.remove("open");stopScanner();if(onSheetClose){const f=onSheetClose;onSheetClose=null;f();}}
document.getElementById("sheetClose").addEventListener("click",closeSheet);
sheetBg.addEventListener("click",closeSheet);

/* ---------- Open Food Facts ---------- */
const OFF="https://world.openfoodfacts.org";
function offToFood(p){
  const n=p.nutriments||{};
  let k=n["energy-kcal_100g"];
  if(k==null&&n["energy_100g"]!=null)k=n["energy_100g"]/4.184;
  if(k==null)return null;
  return {name:[p.product_name,p.brands].filter(Boolean).join(", ")||("Product "+p.code),per100:{k:+k,p:+(n.proteins_100g||0),c:+(n.carbohydrates_100g||0),f:+(n.fat_100g||0)},src:"database",code:p.code};
}
async function fetchJSON(url,ms=9000){
  const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),ms);
  try{
    const r=await fetch(url,{signal:ctl.signal});
    if(r.status===429)throw new Error("The database is rate-limiting us. Wait a minute and try again.");
    if(!r.ok)throw new Error("The database answered with an error ("+r.status+").");
    return await r.json();
  }catch(e){
    if(e.name==="AbortError")throw new Error("The database took too long to answer.");
    if(e instanceof TypeError)throw new Error("No connection to the food database.");
    throw e;
  }finally{clearTimeout(t);}
}
async function offProduct(code){
  const j=await fetchJSON(`${OFF}/api/v2/product/${encodeURIComponent(code)}.json?fields=code,product_name,brands,nutriments`);
  if(j.status!==1||!j.product)return null;
  return offToFood(j.product);
}
async function offSearch(q){
  const j=await fetchJSON(`${OFF}/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=8&fields=code,product_name,brands,nutriments`,12000);
  return (j.products||[]).map(offToFood).filter(Boolean);
}

/* ---------- local search ---------- */
function localSearch(q){
  q=q.trim().toLowerCase();if(!q)return [];
  const words=q.split(/\s+/);
  const score=f=>{const n=f.name.toLowerCase();if(n===q)return 100;if(n.startsWith(q))return 50;let s=0;for(const w of words){if(n.includes(w))s+=10;}return s;};
  const mine=S.foods.map(f=>({...f,src:"mine"}));
  return [...mine,...GENERIC].map(f=>[score(f),f]).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]).map(x=>x[1]).slice(0,12);
}

/* ---------- scanner ---------- */
let scanner=null;
async function startScanner(onCode){
  const holder=document.getElementById("reader");if(!holder)return;
  if(!window.Html5Qrcode){holder.outerHTML='<div class="err">Scanner library did not load. Check your connection and try again.</div>';return;}
  const fmts=[Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,Html5QrcodeSupportedFormats.UPC_A,Html5QrcodeSupportedFormats.UPC_E];
  scanner=new Html5Qrcode("reader",{formatsToSupport:fmts});
  try{
    await scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:260,height:140},aspectRatio:1.5},code=>{stopScanner();onCode(code);});
  }catch(e){
    holder.outerHTML='<div class="err">Camera not available. Safari needs the page on https and camera permission allowed for this site. You can type the barcode number in the search box instead.</div>';
    scanner=null;
  }
}
function stopScanner(){if(scanner){const s=scanner;scanner=null;s.stop().catch(()=>{}).then(()=>{try{s.clear();}catch(e){}});}}

/* ---------- picker: find a food, choose grams, return {name,grams,per100} ---------- */
function openPicker(title,onPick,opts={}){
  const html=`
    <div class="field"><input id="pkQ" placeholder="Search a food or type a barcode number" autocomplete="off" autocapitalize="none"></div>
    <div class="btnrow" style="margin-top:0"><button class="btn secondary sm" id="pkScan" style="flex:1">Scan barcode</button><button class="btn secondary sm" id="pkLabel" style="flex:1">Enter from label</button></div>
    <div id="pkScanArea"></div>
    <div id="pkStatus"></div>
    <div id="pkResults"></div>
    <div id="pkChoose"></div>`;
  openSheet(title,html,opts.onClose);
  const q=document.getElementById("pkQ"),res=document.getElementById("pkResults"),status=document.getElementById("pkStatus"),choose=document.getElementById("pkChoose");
  let timer=null;
  function showChoose(food){
    document.getElementById("pkScanArea").innerHTML="";res.innerHTML="";status.innerHTML="";
    choose.innerHTML=`
      <div class="item" style="margin-top:12px"><div class="body"><div class="name">${esc(food.name)}</div><div class="meta">${r0(food.per100.k)} kcal, ${r1(food.per100.p)} g protein per 100 g</div></div></div>
      <div class="field"><label>Grams</label><input type="number" inputmode="decimal" id="pkG" value="${opts.defaultGrams??100}"></div>
      ${opts.allowFav&&!findFav("food",food.name)?'<label class="small" style="display:flex;gap:8px;align-items:center;margin-bottom:12px"><input type="checkbox" id="pkFav" style="width:auto"> Add to favourites</label>':""}
      <button class="btn green" id="pkAdd">${esc(opts.addLabel||"Add")}</button>
      <button class="btn secondary" id="pkBack" style="margin-top:8px">Pick something else</button>`;
    const g=document.getElementById("pkG");g.focus();g.select();
    document.getElementById("pkAdd").onclick=()=>{const grams=parseFloat(g.value);if(!(grams>0)){toast("Enter the grams");return;}const fv=document.getElementById("pkFav");if(fv&&fv.checked)addFavFood(food.name,food.per100,grams);onPick({name:food.name,grams,per100:{...food.per100}});closeSheet();};
    document.getElementById("pkBack").onclick=()=>{choose.innerHTML="";q.focus();runSearch();};
  }
  function renderResults(list,label){
    if(!list.length)return;
    const srcName={mine:"my food",generic:"generic",database:"database"};
    res.insertAdjacentHTML("beforeend",list.map((f,i)=>`<div class="result" data-i="${i}" data-g="${label}"><div class="body"><div class="name">${esc(f.name)}</div><div class="meta">${r0(f.per100.k)} kcal, ${r1(f.per100.p)} g protein per 100 g</div></div><span class="src">${srcName[f.src]||""}</span></div>`).join(""));
    res.querySelectorAll(`.result[data-g="${label}"]`).forEach(el=>el.onclick=()=>showChoose(list[+el.dataset.i]));
  }
  function runSearch(){
    const v=q.value.trim();res.innerHTML="";status.innerHTML="";choose.innerHTML="";
    if(!v)return;
    if(/^\d{8,14}$/.test(v)){lookupCode(v);return;}
    renderResults(localSearch(v),"local");
    if(v.length>=3)status.innerHTML='<button class="btn secondary sm" id="pkDb" style="margin:8px 0">Search the packaged-food database for "'+esc(v)+'"</button>';
    const b=document.getElementById("pkDb");if(b)b.onclick=()=>dbSearch(v);
  }
  async function dbSearch(v){
    status.innerHTML='<div class="muted small" style="padding:8px 4px">Searching the food database...</div>';
    try{const out=await offSearch(v);if(q.value.trim()!==v)return;status.innerHTML="";renderResults(out,"off");if(!out.length)status.innerHTML='<div class="muted small" style="padding:8px 4px">Nothing in the database for that. Try another word, scan it, or enter it from the label.</div>';}
    catch(e){status.innerHTML='<div class="err">'+esc(e.message)+'</div>';}
  }
  async function lookupCode(code){
    status.innerHTML='<div class="muted small" style="padding:8px 4px">Looking up '+esc(code)+'...</div>';
    const mine=S.foods.find(f=>f.code===code);
    if(mine){showChoose({...mine,src:"mine"});return;}
    try{const f=await offProduct(code);if(f)showChoose(f);else status.innerHTML='<div class="err">Barcode '+esc(code)+' is not in the database. Enter it from the label and it will be saved for next time.</div>';}
    catch(e){status.innerHTML='<div class="err">'+esc(e.message)+'</div>';}
  }
  q.addEventListener("input",()=>{clearTimeout(timer);timer=setTimeout(runSearch,120);});
  q.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();q.blur();const v=q.value.trim();if(v.length>=3&&!/^\d{8,14}$/.test(v))dbSearch(v);}});
  document.getElementById("pkScan").onclick=()=>{choose.innerHTML="";res.innerHTML="";document.getElementById("pkScanArea").innerHTML='<div id="reader"></div>';startScanner(code=>{document.getElementById("pkScanArea").innerHTML="";q.value=code;lookupCode(code);});};
  document.getElementById("pkLabel").onclick=()=>{labelForm(choose,q.value.trim(),f=>showChoose(f));};
  setTimeout(()=>q.focus(),300);
  if(opts.prefill){q.value=opts.prefill;runSearch();}
}
function labelForm(container,prefillName,onSaved){

    <div class="note">Type the per-100 g values from the label.</div>

    <div class="grid4">

      <div class="field"><label>Protein</label><input type="number" inputmode="decimal" id="lfP"></div>
      <div class="field"><label>Carbs</label><input type="number" inputmode="decimal" id="lfC"></div>

/* ---------- nutrition maths ---------- */
const scale=(per100,grams)=>({k:per100.k*grams/100,p:per100.p*grams/100,c:per100.c*grams/100,f:per100.f*grams/100});
function recipeTotals(r){const t={k:0,p:0,c:0,f:0,grams:0};for(const i of r.ingredients){if(!i.per100)continue;const s=scale(i.per100,i.grams||0);t.k+=s.k;t.p+=s.p;t.c+=s.c;t.f+=s.f;t.grams+=i.grams||0;}return t;}

/* ---------- favourites ---------- */
function favKey(f){return f.type==="recipe"?"r:"+f.recipeId:"f:"+f.name.toLowerCase();}
function findFav(type,ref){return S.favs.find(f=>f.type===type&&(type==="recipe"?f.recipeId===ref:f.name.toLowerCase()===ref.toLowerCase()));}
function addFavFood(name,per100,grams){if(findFav("food",name))return;S.favs.push({id:uid(),type:"food",name,per100:{...per100},last:grams||100});save();}
function addFavRecipe(r,servings){if(findFav("recipe",r.id))return;S.favs.push({id:uid(),type:"recipe",recipeId:r.id,name:r.name,last:servings||1});save();}
function removeFav(id){S.favs=S.favs.filter(f=>f.id!==id);save();}
function renderFavs(){
  const box=document.getElementById("favRow");
  S.favs=S.favs.filter(f=>f.type!=="recipe"||S.recipes.some(r=>r.id===f.recipeId));
  S.favs.forEach(f=>{if(f.type==="recipe"){const r=S.recipes.find(x=>x.id===f.recipeId);if(r)f.name=r.name;}});
  if(!S.favs.length){box.innerHTML='<p class="small muted" style="margin-top:12px">Star a recipe or tick "Add to favourites" when logging a food and it will show up here for one-tap adding.</p>';return;}
  box.innerHTML='<div class="favs">'+S.favs.map(f=>`<button class="chip ${f.type}" data-id="${f.id}">${esc(f.name)}<small>${f.type==="recipe"?f.last+" sv":r0(f.last)+" g"}</small></button>`).join("")+'</div>';
  box.querySelectorAll(".chip").forEach(b=>b.onclick=()=>quickAdd(b.dataset.id));
}
function quickAdd(id){
  const f=S.favs.find(x=>x.id===id);if(!f)return;
  const isR=f.type==="recipe";const r=isR?S.recipes.find(x=>x.id===f.recipeId):null;if(isR&&!r)return;
  const t=isR?recipeTotals(r):null,sv=isR?(r.servings||1):1;
  const per=isR?{k:t.k/sv,p:t.p/sv}:{k:f.per100.k,p:f.per100.p};
  openSheet(f.name,`
    <p class="small muted" style="margin-bottom:12px">${isR?`${r0(per.k)} kcal, ${r1(per.p)} g protein per serving`:`${r0(per.k)} kcal, ${r1(per.p)} g protein per 100 g`}</p>
    <div class="field"><label>${isR?"Servings":"Grams"}</label><input type="number" inputmode="decimal" id="qaAmt" value="${f.last}" step="${isR?"0.5":"1"}"></div>
    <button class="btn green" id="qaAdd">Add to today</button>
    <button class="btn danger" id="qaRemove" style="margin-top:8px">Remove from favourites</button>`);
  const a=document.getElementById("qaAmt");a.focus();a.select();
  document.getElementById("qaAdd").onclick=()=>{
    const n=parseFloat(a.value);if(!(n>0)){toast("Enter an amount");return;}
    f.last=n;
    if(isR){addEntry(mkEntry(r.name,"sv",n,{k:t.k/sv,p:t.p/sv,c:t.c/sv,f:t.f/sv}));}
    else{addEntry(mkEntry(f.name,"g",n,{k:f.per100.k/100,p:f.per100.p/100,c:f.per100.c/100,f:f.per100.f/100}));}
    closeSheet();toast("Added "+f.name);
  };
  document.getElementById("qaRemove").onclick=()=>{removeFav(f.id);closeSheet();renderFavs();};
}

/* ---------- today ---------- */
function dayEntries(){const k=dkey(viewDate);return S.log[k]||(S.log[k]=[]);}
function addEntry(e){dayEntries().push({id:uid(),...e});save();renderToday();}
/* unit: "g" or "sv"; perUnit: nutrition per 1 g or per 1 serving */
function mkEntry(name,unit,amount,perUnit){
  const detail=unit==="sv"?`${amount} serving${amount===1?"":"s"}`:`${r0(amount)} g${unit==="g"&&perUnit.raw?" raw":""}`;
  return {name,unit,amount,perUnit,detail,k:perUnit.k*amount,p:perUnit.p*amount,c:perUnit.c*amount,f:perUnit.f*amount};
}
function editEntry(id){
  const k=dkey(viewDate),es=S.log[k]||[],e=es.find(x=>x.id===id);if(!e)return;
  const scalable=!!e.perUnit;
  openSheet("Edit",`
    <div class="field"><label>Name</label><input id="edName" value="${esc(e.name)}"></div>
    ${scalable?`<div class="field"><label>${e.unit==="sv"?"Servings":"Grams"}</label><input type="number" inputmode="decimal" id="edAmt" value="${e.amount}" step="${e.unit==="sv"?"0.5":"1"}"></div>
    <p class="small muted" id="edPreview" style="margin-bottom:12px"></p>`:
    `<p class="small muted" style="margin-bottom:8px">This was logged before amounts were stored, so edit the totals directly.</p>
    <div class="grid4">
      <div class="field"><label>kcal</label><input type="number" inputmode="decimal" id="edK" value="${r0(e.k)}"></div>
      <div class="field"><label>Protein</label><input type="number" inputmode="decimal" id="edP" value="${r1(e.p)}"></div>
      <div class="field"><label>Carbs</label><input type="number" inputmode="decimal" id="edC" value="${r1(e.c)}"></div>
      <div class="field"><label>Fat</label><input type="number" inputmode="decimal" id="edF" value="${r1(e.f)}"></div>
    </div>`}
    <button class="btn green" id="edSave">Save changes</button>
    <button class="btn danger" id="edDel" style="margin-top:8px">Remove from log</button>`);
  const amt=document.getElementById("edAmt");
  function preview(){if(!amt)return;const n=parseFloat(amt.value)||0;document.getElementById("edPreview").textContent=`${r0(e.perUnit.k*n)} kcal, ${r1(e.perUnit.p*n)} g protein`;}
  if(amt){amt.oninput=preview;preview();amt.focus();amt.select();}
  document.getElementById("edSave").onclick=()=>{
    const name=document.getElementById("edName").value.trim()||e.name;
    if(scalable){
      const n=parseFloat(amt.value);if(!(n>0)){toast("Enter an amount");return;}
      Object.assign(e,mkEntry(name,e.unit,n,e.perUnit));
    }else{
      e.name=name;e.k=parseFloat(document.getElementById("edK").value)||0;e.p=parseFloat(document.getElementById("edP").value)||0;e.c=parseFloat(document.getElementById("edC").value)||0;e.f=parseFloat(document.getElementById("edF").value)||0;
    }
    save();closeSheet();renderToday();toast("Updated");
  };
  document.getElementById("edDel").onclick=()=>{S.log[k]=es.filter(x=>x.id!==id);save();closeSheet();renderToday();};
}
function renderToday(){
  const k=dkey(viewDate),today=dkey(new Date());
  const lbl=document.getElementById("dayLabel");
  lbl.textContent=k===today?"Today":viewDate.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
  const es=S.log[k]||[];
  const t=es.reduce((a,e)=>({k:a.k+e.k,p:a.p+e.p,c:a.c+e.c,f:a.f+e.f}),{k:0,p:0,c:0,f:0});
  const T=S.targets;
  document.getElementById("kcalNum").innerHTML=r0(t.k)+"<span>kcal</span>";
  document.getElementById("proNum").innerHTML=r0(t.p)+"<span>g protein</span>";
  document.getElementById("kcalTarget").textContent=T.kcal?`${r0(Math.max(0,T.kcal-t.k))} left of ${T.kcal}`:"";
  document.getElementById("proTarget").textContent=T.protein?`${r0(Math.max(0,T.protein-t.p))} left of ${T.protein}`:"";
  renderFavs();
  const kb=document.getElementById("kcalBar"),pb=document.getElementById("proBar");
  kb.style.width=(T.kcal?Math.min(100,t.k/T.kcal*100):0)+"%";kb.classList.toggle("over",T.kcal&&t.k>T.kcal);
  pb.style.width=(T.protein?Math.min(100,t.p/T.protein*100):0)+"%";pb.classList.toggle("over",false);
  document.getElementById("ratioNum").textContent=(t.k>0?r1(t.p/t.k*100):0).toFixed(1)+" g";
  document.getElementById("macroLine").innerHTML=`<span>carbs ${r0(t.c)} g</span><span>fat ${r0(t.f)} g</span>`;
  const list=document.getElementById("logList");
  if(!es.length){list.innerHTML='<div class="empty">Nothing logged yet. Add a food or a recipe.</div>';return;}
  list.innerHTML=es.map(e=>`<div class="item tap" data-id="${e.id}"><div class="body"><div class="name">${esc(e.name)}</div><div class="meta">${esc(e.detail)}. Tap to edit</div></div><div class="nums"><b>${r0(e.k)} kcal</b>${r1(e.p)} g protein</div><button class="x" data-id="${e.id}" aria-label="Remove">&times;</button></div>`).join("");
  list.querySelectorAll(".item").forEach(el=>el.onclick=()=>editEntry(el.dataset.id));
  list.querySelectorAll(".x").forEach(b=>b.onclick=ev=>{ev.stopPropagation();if(confirm("Remove this from the log?")){S.log[k]=es.filter(e=>e.id!==b.dataset.id);save();renderToday();}});
}
document.getElementById("dayPrev").onclick=()=>{viewDate.setDate(viewDate.getDate()-1);renderToday();};
document.getElementById("dayNext").onclick=()=>{viewDate.setDate(viewDate.getDate()+1);renderToday();};
document.getElementById("addFood").onclick=()=>openPicker("Add food",f=>{addEntry(mkEntry(f.name,"g",f.grams,{k:f.per100.k/100,p:f.per100.p/100,c:f.per100.c/100,f:f.per100.f/100}));toast("Added");},{allowFav:true});
document.getElementById("addRecipeShortcut").onclick=()=>showTab("recipes");

/* ---------- recipes ---------- */
function renderRecipes(){
  const banner=document.getElementById("draftBanner");
  banner.innerHTML=S.draft?`<div class="item tap" id="resumeDraft" style="border-color:var(--kcal)"><div class="body"><div class="name">Unfinished recipe: ${esc(S.draft.name||"untitled")}</div><div class="meta">${S.draft.ingredients.length} ingredient${S.draft.ingredients.length===1?"":"s"}. Tap to carry on.</div></div><span class="pill">draft</span></div>`:"";
  if(S.draft)document.getElementById("resumeDraft").onclick=()=>openBuilder();
  const list=document.getElementById("recipeList");
  if(!S.recipes.length){list.innerHTML='<div class="empty">No recipes yet. Make one and it stays here for good.</div>';return;}
  list.innerHTML=S.recipes.map(r=>{const t=recipeTotals(r),sv=r.servings||1;return `<div class="item tap" data-id="${r.id}"><div class="body"><div class="name">${esc(r.name)}</div><div class="meta">${sv} serving${sv===1?"":"s"}, ${r.ingredients.length} ingredients</div></div><div class="nums"><b>${r0(t.k/sv)} kcal</b>${r1(t.p/sv)} g protein / serving</div></div>`;}).join("");
  list.querySelectorAll(".item").forEach(el=>el.onclick=()=>openRecipe(el.dataset.id));
}
function openRecipe(id){
  const r=S.recipes.find(x=>x.id===id);if(!r)return;
  const t=recipeTotals(r),sv=r.servings||1;
  openSheet(r.name,`
    <div class="hero" style="padding:14px 16px">
      <div class="grid2"><div><div class="small muted">Per serving</div><b>${r0(t.k/sv)} kcal, ${r1(t.p/sv)} g protein</b></div><div><div class="small muted">Whole batch (${r0(t.grams)} g raw)</div><b>${r0(t.k)} kcal, ${r1(t.p)} g protein</b></div></div>
    </div>
    <div class="grid2" style="margin-top:14px">
      <div class="field"><label>Servings to add</label><input type="number" inputmode="decimal" id="rcSv" value="1" step="0.5"></div>
      <div class="field"><label>or raw grams</label><input type="number" inputmode="decimal" id="rcG" placeholder="e.g. 250"></div>
    </div>
    <button class="btn green" id="rcAdd">Add to today</button>
    <div class="btnrow"><button class="btn secondary" id="rcFav">${findFav("recipe",r.id)?"Unfavourite":"Favourite"}</button><button class="btn secondary" id="rcEdit">Edit</button><button class="btn danger" id="rcDel">Delete</button></div>
    <h2 style="margin:20px 0 6px">Ingredients</h2>
    ${r.ingredients.map(i=>`<div class="ing"><div class="body"><div>${esc(i.name)}</div></div><div class="small muted">${r0(i.grams)} g</div></div>`).join("")}
    ${r.method?`<h2 style="margin:20px 0 6px">Method</h2><p style="white-space:pre-wrap;line-height:1.5">${esc(r.method)}</p>`:""}`);
  const sv$=document.getElementById("rcSv"),g$=document.getElementById("rcG");
  sv$.oninput=()=>{if(sv$.value)g$.value="";};g$.oninput=()=>{if(g$.value)sv$.value="";};
  document.getElementById("rcAdd").onclick=()=>{
    const g=parseFloat(g$.value),s=parseFloat(sv$.value);let entry;
    if(g>0){if(!(t.grams>0)){toast("This recipe has no raw weight");return;}entry=mkEntry(r.name,"g",g,{k:t.k/t.grams,p:t.p/t.grams,c:t.c/t.grams,f:t.f/t.grams,raw:true});}
    else if(s>0){entry=mkEntry(r.name,"sv",s,{k:t.k/sv,p:t.p/sv,c:t.c/sv,f:t.f/sv});}
    else{toast("Enter servings or grams");return;}
    addEntry(entry);closeSheet();showTab("today");toast("Added "+r.name);
  };
  document.getElementById("rcFav").onclick=()=>{const fv=findFav("recipe",r.id);if(fv)removeFav(fv.id);else addFavRecipe(r,parseFloat(sv$.value)||1);openRecipe(id);toast(fv?"Removed from favourites":"Added to favourites");};
  document.getElementById("rcEdit").onclick=()=>{
    if(S.draft&&!confirm("You have an unfinished recipe. Editing this one will replace that draft. Continue?"))return;
    S.draft=JSON.parse(JSON.stringify(r));save();closeSheet();openBuilder();
  };
  document.getElementById("rcDel").onclick=()=>{if(confirm("Delete "+r.name+"?")){S.recipes=S.recipes.filter(x=>x.id!==id);save();closeSheet();renderRecipes();}};
}
document.getElementById("newRecipe").onclick=()=>{
  if(S.draft&&!confirm("You have an unfinished recipe. Start a new one and lose it?"))return;
  S.draft={id:uid(),name:"",servings:1,ingredients:[]};save();openBuilder();
};

/* ---------- recipe builder (autosaves to S.draft on every change) ---------- */
function openBuilder(){
  const d=S.draft;if(!d)return;
  openSheet("Recipe",`
    <div class="field"><label>Name</label><input id="bName" value="${esc(d.name)}" placeholder="e.g. Chicken and rice bowls"></div>
    <div class="field"><label>How many servings does this make?</label><input type="number" inputmode="decimal" id="bSv" value="${d.servings||1}" step="0.5"></div>
    <div class="note">Autosaves as you go. Close this, cook, come back later and it will be here.</div>
    <h2 style="margin:12px 0 4px">Ingredients</h2>
    <div id="bIngs"></div>
    <div id="bTotals" class="small muted" style="padding:8px 0"></div>
    <div class="btnrow" style="margin-top:4px"><button class="btn secondary" id="bAdd">Add ingredient</button><button class="btn secondary" id="bPaste">Paste a list</button></div>
    <div id="bPasteArea"></div>
    <div class="field" style="margin-top:18px"><label>Method (optional)</label><textarea id="bMethod" rows="5" placeholder="How you make it. Steps, oven temp, timings, whatever you want to remember.">${esc(d.method||"")}</textarea></div>
    <button class="btn green" id="bSave" style="margin-top:6px">Save recipe</button>
    <button class="btn danger" id="bDiscard" style="margin-top:8px">Discard draft</button>`,renderRecipes);
  const name$=document.getElementById("bName"),sv$=document.getElementById("bSv");
  name$.oninput=()=>{d.name=name$.value;save();};
  sv$.oninput=()=>{d.servings=parseFloat(sv$.value)||1;save();};
  const m$=document.getElementById("bMethod");m$.oninput=()=>{d.method=m$.value;save();};
  function renderIngs(){
    const box=document.getElementById("bIngs");
    if(!d.ingredients.length){box.innerHTML='<div class="muted small" style="padding:6px 0">No ingredients yet.</div>';}
    else box.innerHTML=d.ingredients.map((i,n)=>`<div class="ing"><div class="body">${i.per100?`<div>${esc(i.name)}</div><div class="small muted">${r0(scale(i.per100,i.grams||0).k)} kcal, ${r1(scale(i.per100,i.grams||0).p)} g protein</div>`:`<div class="unmatched">${esc(i.name)}</div><div class="small muted">Not matched. Tap to search.</div>`}</div><input class="g" type="number" inputmode="decimal" value="${i.grams||""}" data-n="${n}" placeholder="g"><button class="x" data-n="${n}" aria-label="Remove">&times;</button></div>`).join("");
    box.querySelectorAll("input.g").forEach(inp=>inp.oninput=()=>{d.ingredients[+inp.dataset.n].grams=parseFloat(inp.value)||0;save();renderTotals();});
    box.querySelectorAll(".x").forEach(b=>b.onclick=()=>{d.ingredients.splice(+b.dataset.n,1);save();renderIngs();});
    box.querySelectorAll(".ing .body").forEach((el,n)=>el.onclick=()=>rematch(n));
    renderTotals();
  }
  function renderTotals(){const t=recipeTotals(d),sv=d.servings||1;document.getElementById("bTotals").textContent=d.ingredients.length?`Batch: ${r0(t.k)} kcal, ${r1(t.p)} g protein from ${r0(t.grams)} g raw. Per serving: ${r0(t.k/sv)} kcal, ${r1(t.p/sv)} g protein.`:"";}
  function rematch(n){
    const i=d.ingredients[n];
    openPicker("Match ingredient",f=>{d.ingredients[n]={name:f.name,grams:f.grams,per100:f.per100};save();openBuilder();},{onClose:()=>{if(S.draft)openBuilder();},prefill:i.name.replace(/\b\d+(\.\d+)?\s*g?\b/g,"").trim(),defaultGrams:i.grams||100,addLabel:"Use this"});
  }
  document.getElementById("bAdd").onclick=()=>openPicker("Add ingredient",f=>{d.ingredients.push({name:f.name,grams:f.grams,per100:f.per100});save();openBuilder();},{onClose:()=>{if(S.draft)openBuilder();},addLabel:"Add to recipe"});
  document.getElementById("bPaste").onclick=()=>{
    const area=document.getElementById("bPasteArea");
    area.innerHTML=`<div class="field" style="margin-top:12px"><label>One ingredient per line, grams first (a bare number means grams). A barcode number on its own also works.</label><textarea id="bPasteText" rows="6" placeholder="200 chicken breast&#10;75 rice&#10;15 olive oil&#10;5000112637939"></textarea></div><button class="btn" id="bMatch">Match ingredients</button>`;
    document.getElementById("bMatch").onclick=async()=>{
      const lines=document.getElementById("bPasteText").value.split("\n").map(l=>l.trim()).filter(Boolean);
      if(!lines.length)return;
      document.getElementById("bMatch").textContent="Matching...";
      for(const line of lines){d.ingredients.push(await matchLine(line));save();}
      area.innerHTML="";renderIngs();
      const un=d.ingredients.filter(i=>!i.per100).length;
      toast(un?`${un} ingredient${un===1?"":"s"} need a match. Tap them.`:"All matched. Check the grams.");
    };
  };
  document.getElementById("bSave").onclick=()=>{
    if(!d.name.trim()){toast("Give it a name");name$.focus();return;}
    if(d.ingredients.some(i=>!i.per100)){toast("Some ingredients are not matched yet");return;}
    if(!d.ingredients.length){toast("Add at least one ingredient");return;}
    const idx=S.recipes.findIndex(r=>r.id===d.id);
    if(idx>=0)S.recipes[idx]=d;else S.recipes.push(d);
    S.draft=null;save();closeSheet();renderRecipes();toast("Saved "+d.name);
  };
  document.getElementById("bDiscard").onclick=()=>{if(confirm("Discard this draft?")){S.draft=null;save();closeSheet();renderRecipes();}};
  renderIngs();
}
async function matchLine(line){
  let grams=0,name=line;
  let m=line.match(/^(\d+(?:\.\d+)?)\s*(?:g|grams?)?\s+(.+)$/i);
  if(m){grams=parseFloat(m[1]);name=m[2].trim();}
  else{m=line.match(/^(.+?)\s+(\d+(?:\.\d+)?)\s*(?:g|grams?)?$/i);if(m){name=m[1].trim();grams=parseFloat(m[2]);}}
  if(/^\d{8,14}$/.test(name)){
    const mine=S.foods.find(f=>f.code===name);
    if(mine)return {name:mine.name,grams,per100:mine.per100};
    try{const f=await offProduct(name);if(f)return {name:f.name,grams,per100:f.per100};}catch(e){}
    return {name:line,grams};
  }
  const loc=localSearch(name);
  if(loc.length)return {name:loc[0].name,grams,per100:loc[0].per100};
  try{const out=await offSearch(name);if(out.length)return {name:out[0].name,grams,per100:out[0].per100};}catch(e){}
  return {name,grams};
}

/* ---------- settings ---------- */
function renderSettings(){
  document.getElementById("tKcal").value=S.targets.kcal||"";
  document.getElementById("tPro").value=S.targets.protein||"";
  const list=document.getElementById("foodList");
  if(!S.foods.length){list.innerHTML='<div class="empty">No saved foods yet.</div>';return;}
  list.innerHTML=S.foods.map(f=>`<div class="item"><div class="body"><div class="name">${esc(f.name)}</div><div class="meta">${r0(f.per100.k)} kcal, ${r1(f.per100.p)} g protein${f.code?", barcode "+esc(f.code):""}</div></div><button class="x" data-id="${f.id}" aria-label="Remove">&times;</button></div>`).join("");
  list.querySelectorAll(".x").forEach(b=>b.onclick=()=>{if(confirm("Remove this food?")){S.foods=S.foods.filter(f=>f.id!==b.dataset.id);save();renderSettings();}});
}
document.getElementById("tKcal").oninput=e=>{S.targets.kcal=parseFloat(e.target.value)||0;save();};
document.getElementById("tPro").oninput=e=>{S.targets.protein=parseFloat(e.target.value)||0;save();};
document.getElementById("newFood").onclick=()=>{openSheet("Add a food",'<div id="lfBox"></div>');labelForm(document.getElementById("lfBox"),"",()=>{closeSheet();renderSettings();toast("Saved");});};
document.getElementById("exportBtn").onclick=()=>{
  const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download="plate-"+dkey(new Date())+".json";document.body.appendChild(a);a.click();a.remove();
};
document.getElementById("importFile").onchange=e=>{
  const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const j=JSON.parse(rd.result);if(!j.targets||!j.recipes)throw 0;if(confirm("Replace everything on this phone with the imported file?")){S=Object.assign({},DEFAULT,j);save();renderSettings();renderToday();toast("Imported");}}catch(err){toast("That file is not a Plate export");}};
  rd.readAsText(f);e.target.value="";
};
document.getElementById("wipeBtn").onclick=()=>{if(confirm("Delete all recipes, foods and logs on this phone?")&&confirm("Really? Export first if you want a copy.")){S=JSON.parse(JSON.stringify(DEFAULT));save();renderSettings();renderToday();renderRecipes();}};

/* ---------- boot ---------- */
renderToday();renderRecipes();renderSettings();
</script>
